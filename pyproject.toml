[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "infostop"
dynamic = ["version"]
description = "Temporospatial clustering in Python. Well suited for mobility data."
readme = "README.md"
license = "MIT"
license-files=["LICEN[CS]E*"]
authors = [
    { name = "Ulf Aslak", email = "ulfjensen@gmail.com" },
    { name = "Laura Alessandretti" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "folium>=0.7.0",
    "infomap>=1.0.6,<3",
    "numpy",
    "pybind11>=2.4",
    "scikit-learn",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/ulfaslak/infostop"

[tool.hatch.version]
path = "infostop/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/infostop",
]
